<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <style>
    /* Default (also what renderers that ignore CSS media queries show, e.g. Google's favicon
       service): opaque black square with the white icon, for search results and home screens. */
    .small { display: none; fill: #fff; }
    @media (prefers-color-scheme: light) { .small { fill: #000; } }
    /* Browser tabs render this under 40px: transparent, icon fills the canvas. */
    @media (max-width: 39.99px) {
      .small { display: inline; }
      .big { display: none; }
    }
  </style>
  <defs>
    <g id="icon">
      <polygon points="451.8 364.7 291.9 87.6 240.1 87.6 374.2 319.9 229.2 319.9 203.2 364.7 400.1 364.7 400.1 364.7 451.8 364.7"/>
      <polygon points="97.3 424.4 417.1 424.4 443.1 379.6 174.8 379.6 245.8 256.6 220 211.8 123.1 379.6 123.1 379.6 97.3 424.4"/>
      <polygon points="220.1 87.6 60.2 364.6 86 409.4 220.2 177.1 292.7 302.6 344.5 302.7 256 149.3 256 149.3 220.1 87.6"/>
    </g>
  </defs>
  <!-- Tabs: transparent, icon fills the canvas -->
  <use class="small" xlink:href="#icon" transform="translate(256 256) scale(1.25) translate(-256 -256)"/>
  <!-- Large: opaque black square, icon sized to sit inside a circle crop with a comfortable margin -->
  <g class="big">
    <rect width="512" height="512" fill="#000"/>
    <use xlink:href="#icon" fill="#fff" transform="translate(256 256) scale(0.8) translate(-256 -256)"/>
  </g>
</svg>
